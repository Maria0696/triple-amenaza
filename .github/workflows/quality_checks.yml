name: Quality checks

on:
  # En todas las PR, sea cual sea su rama base: una PR abierta sobre otra rama
  # de trabajo también pasa el CI y no se queda bloqueada al cambiar de base.
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types and check TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
